<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard de Acompanhamento PAD - Agosto / 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --navy-950:#141b45;
    --navy-900:#1c2660;
    --navy-800:#273577;
    --navy-700:#33449a;
    --navy-100:#e6e9f7;
    --navy-50:#f3f4fb;
    --red-600:#e0071a;
    --red-500:#ff3344;
    --red-100:#fde6e8;
    --green-600:#1f8a4c;
    --green-100:#e5f6ec;
    --amber-600:#b3760a;
    --ink:#1a1c26;
    --ink-soft:#5b5f74;
    --line:#e3e5ef;
    --bg:#f6f7fb;
    --card:#ffffff;
    --radius:14px;
    --font-display:'Sora','Segoe UI',system-ui,sans-serif;
    --font-body:'Inter','Segoe UI',system-ui,sans-serif;
    --font-mono:'JetBrains Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);}
  body{padding-bottom:60px;}
  a{color:inherit;}

  /* ---------- HEADER ---------- */
  header.topbar{
    background:linear-gradient(135deg,var(--navy-950) 0%, var(--navy-800) 100%);
    color:#fff;
    padding:22px clamp(16px,4vw,48px);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:24px;
    position:relative;
    overflow:hidden;
  }
  header.topbar::after{
    content:"";
    position:absolute;
    right:-40px;top:-60%;
    width:260px;height:260px;
    background:radial-gradient(circle, rgba(224,7,26,0.35), transparent 70%);
    pointer-events:none;
  }
  .brand{display:flex;align-items:center;gap:16px;z-index:1;}
  .brand img{height:52px;width:auto;display:block;filter:drop-shadow(0 2px 6px rgba(0,0,0,.25));background:#fff;border-radius:8px;padding:4px 8px;}
  .brand-titles{display:flex;flex-direction:column;gap:2px;}
  .eyebrow{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--red-500);
    font-weight:600;
  }
  h1.title{
    font-family:var(--font-display);
    font-size:clamp(18px,2.4vw,26px);
    font-weight:700;
    margin:2px 0 0 0;
    line-height:1.2;
    letter-spacing:-0.01em;
  }
  .title .accent{color:#ffd7db;}
  .header-meta{
    text-align:right;
    z-index:1;
    font-size:13px;
    color:rgba(255,255,255,.75);
    line-height:1.5;
  }
  .header-meta strong{color:#fff;display:block;font-size:14px;}
  .last-update-info{
    margin-top:8px;padding-top:8px;
    border-top:1px solid rgba(255,255,255,.18);
    font-size:11.5px;color:rgba(255,255,255,.6);
  }
  .last-update-info strong{
    display:inline;color:#ffd7db;font-size:11.5px;font-weight:700;
  }

  /* ---------- LAYOUT ---------- */
  main{max-width:1240px;margin:0 auto;padding:28px clamp(16px,4vw,32px) 0;}

  /* ---------- SELETOR DE DATA (histórico diário) ---------- */
  .date-selector-bar{
    display:none;
    align-items:center;gap:12px;flex-wrap:wrap;
    background:var(--navy-50);border:1px solid var(--line);border-radius:12px;
    padding:12px 16px;margin-bottom:20px;
  }
  .date-selector-bar.has-dates{display:flex;}
  .date-selector-label{
    font-size:12px;font-weight:700;color:var(--navy-900);
    text-transform:uppercase;letter-spacing:.03em;flex:0 0 auto;
  }
  .date-chip-row{display:flex;gap:8px;flex-wrap:wrap;flex:1 1 auto;max-height:120px;overflow-y:auto;}
  .date-chip{
    background:#fff;border:1.5px solid var(--line);color:var(--navy-900);
    font-family:var(--font-mono);font-weight:700;font-size:12px;
    padding:6px 13px;border-radius:100px;cursor:pointer;
    transition:all .15s ease;white-space:nowrap;
  }
  .date-chip:hover{border-color:var(--navy-700);}
  .date-chip.active{background:var(--red-600);color:#fff;border-color:var(--red-600);}
  .date-chip.is-latest::after{content:" · hoje";font-weight:500;opacity:.8;}

  /* ---------- SWITCHER ---------- */
  .switcher{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
    margin-bottom:28px;
  }
  .switch-card{
    background:var(--card);
    border:2px solid var(--line);
    border-radius:var(--radius);
    padding:20px 22px;
    cursor:pointer;
    text-align:left;
    display:flex;
    align-items:center;
    gap:16px;
    transition:border-color .15s ease, box-shadow .15s ease, transform .15s ease;
    box-shadow:0 1px 2px rgba(20,27,69,.04);
  }
  .switch-card:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(20,27,69,.08);}
  .switch-card .icon{
    width:46px;height:46px;flex:0 0 auto;
    border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    background:var(--navy-50);
    color:var(--navy-800);
  }
  .switch-card .icon svg{width:24px;height:24px;}
  .switch-card .txt{flex:1;}
  .switch-card .txt .name{font-family:var(--font-display);font-weight:700;font-size:16px;color:var(--navy-900);}
  .switch-card .txt .desc{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .switch-card .preview{text-align:right;flex:0 0 auto;}
  .switch-card .preview .num{font-family:var(--font-display);font-weight:700;font-size:20px;}
  .switch-card .preview .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);}
  .switch-card.active{
    border-color:var(--red-600);
    background:linear-gradient(180deg,#fff, var(--navy-50));
    box-shadow:0 10px 24px rgba(224,7,26,.14);
  }
  .switch-card.active .icon{background:var(--red-600);color:#fff;}
  .switch-card .chev{color:var(--ink-soft);font-size:20px;}

  /* ---------- SECTION HEADINGS ---------- */
  .section-heading{
    display:flex;align-items:baseline;justify-content:space-between;
    margin:6px 0 14px;
    flex-wrap:wrap;
    gap:6px;
  }
  .section-heading h2{
    font-family:var(--font-display);
    font-size:17px;font-weight:700;color:var(--navy-900);
    margin:0;
    display:flex;align-items:center;gap:8px;
  }
  .section-heading h2 .dot{width:8px;height:8px;border-radius:50%;background:var(--red-600);display:inline-block;}
  .section-heading .note{font-size:12px;color:var(--ink-soft);}

  /* ---------- KPI CARDS ---------- */
  .kpi-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:16px;
    margin-bottom:30px;
  }
  .kpi-grid-3{grid-template-columns:repeat(3,1fr);}
  .kpi-card{
    background:var(--card);
    border-radius:var(--radius);
    border:1px solid var(--line);
    padding:18px 18px 16px;
    position:relative;
    overflow:hidden;
  }
  .kpi-card .bar-top{position:absolute;top:0;left:0;right:0;height:4px;}
  .kpi-card .kpi-label{
    font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;
    color:var(--ink-soft);
    display:flex;align-items:center;justify-content:space-between;
  }
  .kpi-card .kpi-value{
    font-family:var(--font-display);
    font-size:clamp(22px,3vw,30px);
    font-weight:700;
    margin-top:8px;
    line-height:1.1;
  }
  .kpi-card .kpi-sub{font-size:12px;color:var(--ink-soft);margin-top:6px;}
  .kpi-card .kpi-foot{
    margin-top:12px;font-size:11.5px;
    display:flex;align-items:center;gap:6px;
    font-weight:600;
  }
  .pill{
    display:inline-flex;align-items:center;gap:4px;
    padding:2px 8px;border-radius:100px;font-size:11px;font-weight:700;
  }
  .pill.good{background:var(--green-100);color:var(--green-600);}
  .pill.bad{background:var(--red-100);color:var(--red-600);}
  .pill.warn{background:#fdf3e3;color:var(--amber-600);}

  /* ---------- GAP PIE CHART ---------- */
  .kpi-card-gap{padding-bottom:16px;}
  .kpi-gap-row{display:flex;align-items:center;gap:14px;}
  .kpi-gap-text{flex:1 1 auto;min-width:0;}
  .gap-pie-group{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:8px;}
  .gap-pie-wrap{position:relative;width:72px;height:72px;}
  .gap-pie{width:72px;height:72px;border-radius:50%;}
  .gap-pie-hole{
    position:absolute;top:8px;left:8px;width:56px;height:56px;border-radius:50%;
    background:#fff;display:flex;align-items:center;justify-content:center;
    font-family:var(--font-mono);font-weight:700;font-size:12.5px;color:var(--navy-900);
    box-shadow:inset 0 0 0 1px var(--line);
  }
  .gap-pie-legend{display:flex;flex-direction:column;gap:3px;font-size:10px;color:var(--ink-soft);white-space:nowrap;}
  .gap-pie-legend span{display:flex;align-items:center;gap:5px;}
  .gap-pie-legend i{width:8px;height:8px;border-radius:2px;display:inline-block;}


  /* ---------- ANÁLISE GERAL DE LOJAS (cards) ---------- */
  .analise-grid{grid-template-columns:repeat(auto-fit, minmax(230px, 1fr));}
  .analise-card .kpi-value-sm{font-size:clamp(18px,2.4vw,22px);margin-top:6px;}
  .kpi-divider{height:1px;background:var(--line);margin:14px 0 12px;}
  .analise-total-card{border-color:var(--navy-800);background:linear-gradient(180deg,#fff,var(--navy-50));}

  .good-text{color:var(--green-600);}
  .bad-text{color:var(--red-600);}

  /* ---------- BANDEIRAS STRIP (lojas only) ---------- */
  .flags-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
    margin-bottom:30px;
  }
  .flag-card{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:14px 16px;
  }
  .flag-card .flag-name{font-weight:700;font-size:13px;color:var(--navy-900);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
  .flag-card .flag-numbers{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-soft);margin-bottom:6px;}
  .track{height:8px;border-radius:5px;background:var(--navy-50);overflow:hidden;}
  .track > span{display:block;height:100%;border-radius:5px;background:var(--navy-700);}
  .track > span.over{background:var(--green-600);}
  .track > span.under{background:var(--red-600);}

  /* ---------- CHART ---------- */
  .chart-card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:20px 22px 14px;margin-bottom:30px;
  }
  .bar-row{display:grid;grid-template-columns:150px 1fr 90px;align-items:center;gap:12px;padding:7px 0;font-size:12.5px;border-bottom:1px dashed var(--line);}
  .bar-row:last-child{border-bottom:none;}
  .bar-row .gname{font-weight:600;color:var(--navy-900);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bar-track{position:relative;height:16px;background:var(--navy-50);border-radius:6px;overflow:hidden;}
  .bar-fill{position:absolute;left:0;top:0;height:100%;border-radius:6px;background:var(--navy-700);}
  .bar-fill.bad{background:var(--red-500);}
  .bar-marker{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--navy-900);}
  .bar-marker-mes{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--red-500);}
  .bar-pct{text-align:right;font-weight:700;font-family:var(--font-mono);}

  .bar-row-v2{padding:14px 18px 16px;}
  .bar-row-v2 .bar-track{height:18px;}
  .bar-pct-inline{font-family:var(--font-mono);font-weight:700;font-size:12.5px;margin-left:auto;}
  .bar-track-wrap{position:relative;padding-top:40px;}
  .bar-meta-marker-group{
    position:absolute;top:0;height:40px;
    transform:translateX(-50%);
    display:flex;flex-direction:column;align-items:center;
    white-space:nowrap;
  }
  .bar-meta-marker-group .label-name{
    font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;
    color:var(--ink-soft);line-height:1.3;
  }
  .bar-meta-marker-group .label-value{
    font-family:var(--font-mono);font-size:10.5px;font-weight:700;
    color:var(--navy-900);line-height:1.3;
  }
  .bar-meta-marker-group .connector{
    width:2px;flex:1 1 auto;background:var(--navy-900);margin-top:2px;
  }
  .bar-meta-marker-group .connector.connector-mes{background:var(--red-500);}
  .bar-numbers{margin-top:6px;font-size:12px;color:var(--ink-soft);display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
  .bar-numbers-sep{font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;}

  /* ---------- TABLE / ACCORDION ---------- */
  .table-card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;margin-bottom:30px;
  }
  .table-head-row{
    display:grid;
    background:var(--navy-900);color:#fff;
    font-size:11px;text-transform:uppercase;letter-spacing:.04em;font-weight:700;
    padding:12px 18px;
  }
  .grid-lojas{grid-template-columns:1.4fr 1fr 1fr 1fr 0.7fr 1fr 1.05fr 0.9fr; min-width:920px;}
  .grid-distrib{grid-template-columns:1.4fr 1fr 1fr .8fr .8fr .8fr 1.1fr;}
  .grid-distrib-fat{grid-template-columns:1.4fr 1fr 1fr 1fr 0.8fr;}
  .table-head-row > div:not(:first-child){text-align:right;}
  .table-head-row > div:first-child{text-align:left;}

  details.gestor-row{border-bottom:1px solid var(--line);}
  details.gestor-row:last-of-type{border-bottom:none;}
  details.gestor-row summary{
    list-style:none;cursor:pointer;
    display:grid;
    align-items:center;
    padding:12px 18px;
    font-size:13px;
  }
  details.gestor-row summary::-webkit-details-marker{display:none;}
  details.gestor-row summary > div{text-align:right;}
  details.gestor-row summary > div:first-child,
  details.gestor-row summary > div:nth-child(2){text-align:left;}
  details.gestor-row summary .chev{
    transition:transform .15s ease;color:var(--ink-soft);
  }
  details.gestor-row[open] summary .chev{transform:rotate(90deg);}
  details.gestor-row summary .gestor-name{font-weight:700;color:var(--navy-900);}
  details.gestor-row summary .cod{color:var(--ink-soft);font-weight:500;font-size:11.5px;}
  .subtable{background:var(--navy-50);padding:4px 18px 12px;}
  .subrow{
    display:grid;
    padding:8px 0;
    font-size:12.5px;
    border-bottom:1px solid #e3e6f5;
    align-items:center;
  }
  .subrow:last-child{border-bottom:none;}
  .subrow > div{text-align:right;}
  .subrow > div:first-child{text-align:left;color:var(--ink-soft);padding-left:20px;}
  .grid-lojas .subrow{grid-template-columns:1.4fr 1fr 1fr 1fr 0.7fr 1fr 1.05fr 0.9fr; min-width:920px;}
  .table-scroll{overflow-x:auto;}
  .table-scroll .grid-lojas{padding-right:18px;}
  details.gestor-group{border-bottom:1px solid var(--line);}
  details.gestor-group:last-of-type{border-bottom:none;}
  .gestor-group-label{
    background:var(--navy-900);color:#fff;
    font-weight:700;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;
    padding:9px 18px;
    display:flex;align-items:center;gap:10px;
    cursor:pointer;user-select:none;
    list-style:none;
  }
  .gestor-group-label::-webkit-details-marker{display:none;}
  .gestor-group-label .cod{color:rgba(255,255,255,.6);font-weight:500;text-transform:none;margin-left:6px;}
  .chev-updown{
    display:flex;align-items:center;
    color:rgba(255,255,255,.85);
    transition:transform .18s ease;
    flex:0 0 auto;
  }
  .chev-updown svg{width:15px;height:15px;}
  details.gestor-group[open] .chev-updown{transform:rotate(180deg);}

  /* ---------- ATINGIMENTO DA META DO DIA (por loja) ---------- */
  .day-goal-loja-block{padding:14px 18px 16px;border-bottom:1px solid var(--line);}
  .day-goal-loja-block:last-child{border-bottom:none;}
  .day-goal-loja-name{font-weight:700;font-size:12.5px;color:var(--navy-900);margin-bottom:8px;}
  .day-goal-track{
    position:relative;height:18px;border-radius:7px;
    background:var(--navy-50);border:1px solid var(--line);overflow:hidden;
  }
  .day-goal-fill{position:absolute;left:0;top:0;height:100%;border-radius:7px;background:var(--navy-700);transition:width .2s ease;}
  .day-goal-fill.bad{background:var(--red-500);}
  .day-goal-marker{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--navy-900);}
  .day-goal-numbers{
    margin-top:8px;font-size:12.5px;color:var(--ink-soft);
    display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
  }
  .day-goal-numbers .day-goal-sep{font-size:11px;}
  .day-goal-numbers .day-goal-pct{margin-left:auto;font-size:14px;}

  /* ---------- SELETOR INDIVIDUAL DE GESTOR ---------- */
  .gestor-picker{
    display:flex;flex-wrap:wrap;gap:9px;
    margin-bottom:18px;
  }
  .gestor-chip{
    background:#fff;border:1.5px solid var(--line);color:var(--navy-900);
    font-family:var(--font-body);font-weight:700;font-size:12.5px;
    padding:9px 16px;border-radius:100px;cursor:pointer;
    transition:border-color .15s ease, background .15s ease, color .15s ease;
  }
  .gestor-chip:hover{border-color:var(--navy-700);}
  .gestor-chip .cod{opacity:.55;font-weight:500;margin-left:6px;font-size:11px;}
  .gestor-chip.active{background:var(--red-600);color:#fff;border-color:var(--red-600);}
  .gestor-chip.active .cod{opacity:.85;}

  .gestor-detail-panel{
    border:1px solid var(--line);border-radius:var(--radius);
    background:var(--card);
    padding:22px clamp(16px,3vw,26px) 8px;
    margin-bottom:30px;
  }
  .gestor-detail-empty{
    color:var(--ink-soft);font-size:13px;text-align:center;padding:34px 10px;
  }
  .gestor-detail-header h3{
    font-family:var(--font-display);font-size:17px;font-weight:700;color:var(--navy-900);margin:0 0 4px;
  }
  .gestor-detail-header h3 .cod{color:var(--ink-soft);font-weight:500;font-size:12px;margin-left:8px;}
  .section-heading.detail-sub{margin:20px 0 12px;}
  .section-heading.detail-sub h2{font-size:14px;}

  /* ---------- ALERTA / SPLASH INDIVIDUAL DO GESTOR ---------- */
  .gestor-alert{
    display:flex;align-items:flex-start;gap:10px;
    border:1.5px solid transparent;border-radius:12px;
    padding:12px 14px;margin:12px 0 18px;
    font-size:13px;line-height:1.45;
  }
  .gestor-alert-icon{font-size:16px;line-height:1.4;flex:0 0 auto;}
  .gestor-alert-text strong{font-weight:700;}
  .gestor-alert-red{background:var(--red-100);border-color:var(--red-600);color:var(--red-600);}
  .gestor-alert-yellow{background:#fdf3e3;border-color:var(--amber-600);color:var(--amber-600);}
  .gestor-alert-green{background:var(--green-100);border-color:var(--green-600);color:var(--green-600);}
  .gestor-alert-warn{background:var(--navy-50);border-color:var(--line);color:var(--ink-soft);}

  .grid-margem{grid-template-columns:1.3fr 1fr 1fr 1fr 1fr 0.8fr; min-width:760px;}

  .mono{font-family:var(--font-mono);}
  .num-strong{font-weight:700;}

  footer.pagefoot{
    max-width:1240px;margin:0 auto;padding:6px clamp(16px,4vw,32px) 40px;
    font-size:11.5px;color:var(--ink-soft);
    display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;
  }

  @media (max-width: 880px){
    .switcher{grid-template-columns:1fr;}
    .kpi-grid{grid-template-columns:1fr 1fr;}
    .flags-grid{grid-template-columns:1fr 1fr;}
    header.topbar{flex-direction:column;align-items:flex-start;gap:12px;}
    .header-meta{text-align:left;}
    .table-head-row, details.gestor-row summary, .subrow{font-size:11px;}
  }
  @media (max-width: 560px){
    .kpi-grid{grid-template-columns:1fr;}
    .flags-grid{grid-template-columns:1fr;}
    .grid-distrib{grid-template-columns:1fr;}
    .table-head-row.grid-distrib > div:not(:first-child){display:none;}
    .grid-distrib-fat{grid-template-columns:1fr;}
    .table-head-row.grid-distrib-fat > div:not(:first-child){display:none;}
  }
</style>
</head>
<body>

const fmtBRL = (v) => {
  if(v===null || v===undefined || isNaN(v)) return '—';
  return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
};
const fmtBRLc = (v) => { // compact for cards
  if(v===null || v===undefined || isNaN(v)) return '—';
  const abs = Math.abs(v);
  if(abs>=1000000) return (v/1000000).toLocaleString('pt-BR',{maximumFractionDigits:2})+' mi';
  if(abs>=1000) return (v/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mil';
  return v.toLocaleString('pt-BR',{maximumFractionDigits:0});
};
const fmtBRLfull = (v) => { // valor cheio, sem abreviação — igual ao que está na planilha
  if(v===null || v===undefined || isNaN(v)) return '—';
  return v.toLocaleString('pt-BR',{maximumFractionDigits:0});
};
const fmtPct = (v,d=1) => {
  if(v===null || v===undefined || isNaN(v)) return '—';
  return (v*100).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d})+'%';
};
const clamp01 = (v) => Math.max(0, Math.min(1, v));
const fmtNum = (v,d=2) => {
  if(v===null || v===undefined || isNaN(v)) return '—';
  return v.toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
};

function ritmo(row){
  if(!row.fat_meta_prop) return null;
  return row.fat_real / row.fat_meta_prop;
}
function gap(row){
  if(row.fat_meta===null||row.fat_meta===undefined) return null;
  return row.fat_meta - (row.fat_real||0);
}
function pillClass(v, thresh=1){
  if(v===null||v===undefined||isNaN(v)) return 'warn';
  return v>=thresh ? 'good' : 'bad';
}

/* Splash/alerta individual do gestor — em 2ª pessoa, aponta o indicador
   mais crítico entre os informados (checks), na ordem de prioridade dada.
   < 90%  = alerta vermelho
   90-100% = atenção amarela
   >= 100% = positivo verde                                              */
function gestorAlertHTML(nome, checks){
  const valid = checks.filter(c => c.value!==null && c.value!==undefined && !isNaN(c.value));
  if(valid.length===0){
    return `<div class="gestor-alert gestor-alert-warn">
      <span class="gestor-alert-icon">ℹ️</span>
      <div class="gestor-alert-text">Ainda não há dados suficientes dos seus indicadores este mês.</div>
    </div>`;
  }
  const red = valid.find(c => c.value < 0.90);
  const yellow = !red && valid.find(c => c.value < 1.00);
  const chosen = red || yellow || valid[0];
  const level = red ? 'red' : (yellow ? 'yellow' : 'green');

  let msg;
  if(level==='red'){
    msg = `Você precisa se atentar à sua ${chosen.label}, que ainda está em ${fmtPct(chosen.value)} da meta.`;
  } else if(level==='yellow'){
    msg = `Você está quase lá — sua ${chosen.label} está em ${fmtPct(chosen.value)} da meta. Falta pouco para bater 100%.`;
  } else {
    msg = `Sua ${chosen.label} está em ${fmtPct(chosen.value)} da meta — dentro do esperado.`;
  }
  const icon = level==='red' ? '⚠️' : (level==='yellow' ? '🟡' : '✅');
  return `<div class="gestor-alert gestor-alert-${level}">
    <span class="gestor-alert-icon">${icon}</span>
    <div class="gestor-alert-text"><strong>Oi, ${nome}!</strong> ${msg}</div>
  </div>`;
}

function gapPieHTML(total){
  const meta = total.fat_meta, real = total.fat_real;
  let frac = 0;
  if(meta){ frac = clamp01((real||0)/meta); }
  const pct = Math.round(frac*100);
  const gapFrac = 1 - frac;
  return `
  <div class="gap-pie-group">
    <div class="gap-pie-wrap">
      <div class="gap-pie" style="background:conic-gradient(var(--navy-700) 0turn ${frac}turn, var(--red-200) ${frac}turn 1turn);"></div>
      <div class="gap-pie-hole">${pct}%</div>
    </div>
    <div class="gap-pie-legend">
      <span><i style="background:var(--navy-700)"></i>Realizado</span>
      <span><i style="background:var(--red-200)"></i>Gap ${Math.round(gapFrac*100)}%</span>
    </div>
  </div>`;
}

function kpiCardsHTML(total){
  const rtm = ritmo(total);
  const g = gap(total);
  const fatPct = total.fat_pct;

  const gapIsPositive = g!==null && g>0; // still needs to hit target
  const gapLabel = g===null ? '—' : (g<=0 ? ('Meta batida · superávit de ' + fmtBRL(Math.abs(g))) : ('Faltam ' + fmtBRL(g) + ' no mês'));

  return `
  <div class="kpi-grid kpi-grid-3">
    <div class="kpi-card">
      <div class="bar-top" style="background:var(--navy-700)"></div>
      <div class="kpi-label">Faturamento — Real / Meta</div>
      <div class="kpi-value">${fmtPct(fatPct)}</div>
      <div class="kpi-sub">${fmtBRLc(total.fat_real)} de ${fmtBRLc(total.fat_meta)} (meta do mês)</div>
      <div class="kpi-foot"><span class="pill ${pillClass(fatPct)}">${fatPct>=1?'Meta atingida':'Abaixo da meta'}</span></div>
    </div>

    <div class="kpi-card">
      <div class="bar-top" style="background:var(--navy-800)"></div>
      <div class="kpi-label">Ritmo do mês — vs. Meta Proporcional</div>
      <div class="kpi-value">${fmtPct(rtm)}</div>
      <div class="kpi-sub">${fmtBRLc(total.fat_real)} de ${fmtBRLc(total.fat_meta_prop)} (proporcional ao dia)</div>
      <div class="kpi-foot"><span class="pill ${pillClass(rtm)}">${rtm>=1?'No ritmo ou acima':'Abaixo do ritmo'}</span></div>
    </div>

    <div class="kpi-card kpi-card-gap">
      <div class="bar-top" style="background:${gapIsPositive?'var(--red-600)':'var(--green-600)'}"></div>
      <div class="kpi-gap-row">
        <div class="kpi-gap-text">
          <div class="kpi-label">Gap para bater a meta do mês</div>
          <div class="kpi-value" style="color:${gapIsPositive?'var(--red-600)':'var(--green-600)'}">${g===null?'—':fmtBRLc(Math.abs(g))}</div>
          <div class="kpi-sub">${gapLabel}</div>
          <div class="kpi-foot"><span class="pill ${gapIsPositive?'bad':'good'}">${gapIsPositive?'Meta ainda não batida':'Meta superada'}</span></div>
        </div>
        ${gapPieHTML(total)}
      </div>
    </div>
  </div>`;
}

function flagsStripHTML(bandeiras){
  return `<div class="flags-grid">` + bandeiras.map(b=>{
    const pct = clamp01(b.fat_pct||0);
    const over = (b.fat_pct||0) >= 1;
    return `
    <div class="flag-card">
      <div class="flag-name">${b.label} <span class="mono" style="font-size:11px;color:${over?'var(--green-600)':'var(--red-600)'}">${fmtPct(b.fat_pct)}</span></div>
      <div class="flag-numbers"><span>${fmtBRLc(b.fat_real)}</span><span>meta ${fmtBRLc(b.fat_meta)}</span></div>
      <div class="track"><span class="${over?'over':'under'}" style="width:${pct*100}%"></span></div>
    </div>`;
  }).join('') + `</div>`;
}

/* Análise Geral de Lojas — aba PAD LOJAS, linhas 92 a 95 (bandeiras)
   Cartões no mesmo estilo dos KPI cards: Faturamento (Meta / Meta Prop. / Realizado)
   e, dentro do mesmo cartão, Margem (Meta / Meta Prop. / Realizado) */
function analiseGeralLojasHTML(bandeiras, total){
  const rows = bandeiras;
  return `<div class="kpi-grid analise-grid">
    ${rows.map(b=>{
      const fatOver = (b.fat_pct||0) >= 1;
      const mbOver = (b.mb_pct||0) >= 1;
      return `
      <div class="kpi-card analise-card">
        <div class="bar-top" style="background:${fatOver?'var(--navy-700)':'var(--red-500)'}"></div>
        <div class="kpi-label">${b.label} &middot; Faturamento</div>
        <div class="kpi-value">${fmtPct(b.fat_pct)}</div>
        <div class="kpi-sub">${fmtBRLc(b.fat_real)} de ${fmtBRLc(b.fat_meta)} (meta) &middot; prop. ${fmtBRLc(b.fat_meta_prop)}</div>
        <div class="kpi-foot"><span class="pill ${fatOver?'good':'bad'}">${fatOver?'Meta atingida':'Abaixo da meta'}</span></div>

        <div class="kpi-divider"></div>

/* =========================================================
   ATUALIZAÇÃO DE DADOS A PARTIR DE UM NOVO ARQUIVO .XLSX
   Lê o arquivo no navegador (SheetJS) e refaz o parsing
   seguindo a mesma estrutura da planilha PAD_AGOSTO_2026.
   ========================================================= */

function cell(rows, r, c){
  const row = rows[r];
  if(!row) return null;
  const v = row[c];
  return (v===undefined || v==='') ? null : v;
}

function findFirstDataRow(rows, codeRegex){
  for(let r=0;r<rows.length;r++){
    const v = cell(rows,r,0);
    if(v!==null && codeRegex.test(String(v).trim())) return r;
  }
  return -1;
}

function parseLojasSheet(rows){
  const startRow = findFirstDataRow(rows, /^C\d+/i);
  const gestores = [];
  let cur = null;
  let r = startRow;
  let bandeiraStart = -1;

  while(r < rows.length){
    const codV = cell(rows,r,0), gerV = cell(rows,r,1), lojaV = cell(rows,r,2);
    if(lojaV===null){ r++; continue; }
    const lojaStr = String(lojaV).trim();
    if(lojaStr.toUpperCase() === 'TOTAL LOJAS'){ break; }
    if(lojaStr.toUpperCase().startsWith('TOTAL')){
      if(cur){
        cur.total = buildLojasRow(rows,r);
        cur.total.label = lojaStr;
        gestores.push(cur);
        cur = null;
      }
      r++; continue;
    }
    if(gerV!==null && String(gerV).trim().toUpperCase()!=='TOTAL'){ cur = {cod: codV, nome: renameGestor(gerV), lojas: []}; }
    if(cur){
      const row = buildLojasRow(rows,r);
      row.loja = lojaStr;
      cur.lojas.push(row);
    }
    r++;
  }
  bandeiraStart = r; // row after break, but break happened right at 'TOTAL LOJAS' row -> need bandeiras before it
  // find bandeiras: walk upward from bandeiraStart-1 while col A/B empty and col C non-empty and not TOTAL
  const bandeiras = [];
  let br = bandeiraStart - 1;
  // skip blank separator row(s) between last gestor total and the bandeira block
  while(br >= 0 && cell(rows,br,2)===null) br--;
  const collected = [];
  while(br >= 0){
    const c0=cell(rows,br,0), c1=cell(rows,br,1), c2=cell(rows,br,2);
    if(c2===null){ break; }
    const label = String(c2).trim();
    if(label.toUpperCase().startsWith('TOTAL')) break;
    if(c0!==null) break;
    // the first bandeira row's col B sometimes literally says "TOTAL" (a section marker) — that's fine
    if(c1!==null && String(c1).trim().toUpperCase()!=='TOTAL') break;
    collected.unshift({row:br, label});
    br--;
  }
  collected.forEach(item=>{
    const row = buildLojasRow(rows, item.row);
    row.label = item.label;
    bandeiras.push(row);
  });

  const totalRow = buildLojasRow(rows, bandeiraStart);
  totalRow.label = 'TOTAL LOJAS';

  return { total: totalRow, bandeiras, gestores };
}

function buildLojasRow(rows, r){
  const fat_meta = num(cell(rows,r,7));
  const fat_meta_prop = num(cell(rows,r,8));
  const fat_real = num(cell(rows,r,9));
  const fat_pct = num(cell(rows,r,10));
  const mref_proposta = num(cell(rows,r,18));
  const mref_real = num(cell(rows,r,19));
  let lb_pct = null;
  if(mref_proposta){ lb_pct = mref_real/mref_proposta; }
  const day_meta = num(cell(rows,r,26));
  const day_real = num(cell(rows,r,27));
  let day_pct = null;
  if(day_meta){ day_pct = day_real/day_meta; }
  return {
    estoque_real: num(cell(rows,r,4)),
    pct_venda: num(cell(rows,r,5)),
    fat_meta, fat_meta_prop, fat_real, fat_pct,
    lb_meta: mref_proposta, lb_real: mref_real, lb_pct,
    mb_meta: num(cell(rows,r,12)),
    mb_meta_prop: num(cell(rows,r,13)),
    mb_real_verba: num(cell(rows,r,14)),
    mb_real_total: num(cell(rows,r,15)),
    mb_pct: num(cell(rows,r,16)),
    day_meta, day_real, day_pct,
  };
}

/* Nomes de gestor que a planilha traz "em aberto" ou incompletos
   e que devem aparecer com o nome correto no dashboard. */
const GESTOR_RENAME = { 'em aberto': 'ISAIAS - BAZAR', 'higiene': 'HEMILI - HIGIENE' };
function renameGestor(nome){
  if(nome===null || nome===undefined) return nome;
  const key = String(nome).trim().toLowerCase();
  return GESTOR_RENAME[key] || nome;
}

function parseDistribSheet(rows){
  const startRow = findFirstDataRow(rows, /^C\d+/i);
  const gestores = [];
  let total = null;
  for(let r=startRow; r<rows.length; r++){
    const gerV = cell(rows,r,1);
    if(gerV===null) continue;
    const gerStr = String(gerV).trim();
    const row = buildDistribRow(rows,r);
    row.nome = gerStr;
    row.cod = cell(rows,r,0);
    if(gerStr.toUpperCase().startsWith('TOTAL')){
      total = row;
      break;
    } else {
      gestores.push(row);
    }
  }
  return { total, gestores };
}

function buildDistribRow(rows, r){
  return {
    estoque_real: num(cell(rows,r,3)),
    pct_venda: num(cell(rows,r,4)),
    fat_meta: num(cell(rows,r,6)),
    fat_meta_prop: num(cell(rows,r,7)),
    fat_real: num(cell(rows,r,8)),
    fat_pct: num(cell(rows,r,9)),
    lb_meta: num(cell(rows,r,11)),
    lb_real: num(cell(rows,r,12)),
    lb_pct: num(cell(rows,r,13)),
    mb_meta: num(cell(rows,r,15)),
    mb_real_total: num(cell(rows,r,18)),
    mb_pct: num(cell(rows,r,19)),
    day_meta: num(cell(rows,r,21)),
    day_real: num(cell(rows,r,22)),
    day_lb: num(cell(rows,r,23)),
    day_lb_pct: num(cell(rows,r,24)),
  };
}

function num(v){
  if(v===null||v===undefined||v==='') return null;
  const n = Number(v);
  return isNaN(n) ? null : n;
}

function handleWorkbook(workbook){
  const shLojas = workbook.Sheets['PAD - LOJAS'];
  const shDistrib = workbook.Sheets['PAD - DISTRIBUIÇÃO'];
  if(!shLojas || !shDistrib){
    alert('Não encontrei as abas "PAD - LOJAS" e "PAD - DISTRIBUIÇÃO" nesse arquivo. Confirme se é a planilha PAD no mesmo layout.');
    return;
  }
  const rowsLojas = XLSX.utils.sheet_to_json(shLojas, {header:1, defval:null, raw:true});
  const rowsDistrib = XLSX.utils.sheet_to_json(shDistrib, {header:1, defval:null, raw:true});

  try{
    const lojas = parseLojasSheet(rowsLojas);
    const distribuicao = parseDistribSheet(rowsDistrib);
    DATA = { lojas, distribuicao };
    refreshPreviewNumbers();
    if(currentView==='lojas') renderLojas(); else renderDistribuicao();
  }catch(err){
    console.error(err);
    alert('Não consegui ler essa planilha automaticamente. Estrutura pode ter mudado. Envie o arquivo para o Claude regenerar o dashboard.');
  }
}

/* =========================================================
   HISTÓRICO DIÁRIO — lê dados/indice.json (se existir) e permite
   trocar entre TODOS os dias já salvos (desde o começo do histórico),
   buscando o .xlsx de cada dia diretamente do servidor.
   Ao abrir o link, mostra sempre o dia mais recente disponível
   (o dia atual, ou o dia da última atualização caso o de hoje
   ainda não tenha sido publicado).
   Só funciona quando o dashboard está hospedado (http/https);
   não funciona abrindo o arquivo localmente (protocolo file://) —
   nesse caso, mostra os dados já embutidos neste arquivo.
   ========================================================= */
const MESES_PT = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
let AVAILABLE_DATES = [];
let CURRENT_DATE_IDX = -1;

function fmtDiaChip(iso){
  const [y,mo,da] = iso.split('-');
  return da+'/'+mo+'/'+y.slice(2);
}
function fmtDiaFull(iso){
  const [y,mo,da] = iso.split('-');
  return da+'/'+mo+'/'+y;
}
function fmtMesAno(iso){
  const [y,mo] = iso.split('-');
  return MESES_PT[parseInt(mo,10)-1] + ' ' + y;
}

function renderDateSelector(){
  const bar = document.getElementById('dateSelectorBar');
  if(!bar) return;
  if(AVAILABLE_DATES.length === 0){
    bar.classList.remove('has-dates');
    bar.innerHTML = '';
    return;
  }
  bar.classList.add('has-dates');
  const lastIdx = AVAILABLE_DATES.length - 1;
  bar.innerHTML = `
    <span class="date-selector-label">Histórico &middot; ver dados de:</span>
    <div class="date-chip-row">
      ${AVAILABLE_DATES.map((d,i)=>`<button type="button" class="date-chip ${i===CURRENT_DATE_IDX?'active':''} ${i===lastIdx?'is-latest':''}" onclick="loadDateFile(${i})">${fmtDiaChip(d.data)}</button>`).join('')}
    </div>
  `;
}

async function loadDateIndex(){
  try{
    const res = await fetch('dados/indice.json', {cache:'no-store'});
    if(!res.ok) return; // pasta/índice não existe — usa os dados já embutidos no arquivo
    const idx = await res.json();
    AVAILABLE_DATES = (idx.arquivos || [])
      .filter(a => a.data)
      .sort((a,b) => a.data.localeCompare(b.data));
    if(AVAILABLE_DATES.length === 0) return;
    const todayIso = new Date().toLocaleDateString('en-CA'); // AAAA-MM-DD
    let defaultIdx = AVAILABLE_DATES.findIndex(a => a.data === todayIso);
    if(defaultIdx === -1) defaultIdx = AVAILABLE_DATES.length - 1; // sem arquivo de hoje ainda: mostra a última atualização
    renderDateSelector();
    await loadDateFile(defaultIdx);
  }catch(e){
    console.warn('Histórico diário não encontrado (dados/indice.json). Usando os dados já embutidos neste arquivo.', e);
  }
}

async function loadDateFile(i){
  const entry = AVAILABLE_DATES[i];
  if(!entry) return;
  try{
    const res = await fetch(entry.arquivo, {cache:'no-store'});
    const buf = await res.arrayBuffer();
    const workbook = XLSX.read(new Uint8Array(buf), {type:'array'});
    CURRENT_DATE_IDX = i;
    handleWorkbook(workbook);
    renderDateSelector();
    document.getElementById('titleMonth').textContent = fmtMesAno(entry.data);
    const lastEntry = AVAILABLE_DATES[AVAILABLE_DATES.length-1];
    document.getElementById('lastUpdateDateTime').textContent = fmtDiaFull(lastEntry.data);
  }catch(e){
    console.error('Não consegui carregar o arquivo do dia', entry, e);
    alert('Não consegui carregar os dados de ' + fmtDiaChip(entry.data) + '.');
  }
}

loadDateIndex();
</script>
